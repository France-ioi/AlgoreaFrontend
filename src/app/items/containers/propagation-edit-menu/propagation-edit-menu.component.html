<div class="header" i18n>
  Default access
  <span
    class="ph-duotone ph-info note-icon alg-white-color"
    i18n-algTooltip algTooltip="If you have the right, choose below how users will see this content within the chapter. Note that they will see it regardless if they have access to it in another chapter or have obtained rights that unlock it."
    tooltipPosition="left"
    tooltipStyleClass="secondary"
  >
  </span>
</div>
<ul class="menu">
  <li class="menu-item">
    <button
      class="menu-item-button"
      type="button"
      [class.active]="childData().contentViewPropagation === 'none'"
      (click)="onClick('none')"
    >
      <div class="menu-item-title">{{ noneOption().label }}</div>
      <div class="menu-item-icon">
        <i [class]="noneOption().icon" aria-hidden="true"></i>
      </div>
    </button>
  </li>
  <li class="menu-item">
    <button
      class="menu-item-button"
      type="button"
      [class.active]="childData().contentViewPropagation === 'as_info'"
      [disabled]="!((childData().permissions && (childData().permissions! | allowsGrantingView)) || [ 'as_info', 'as_content' ].includes(childData().contentViewPropagation || ''))"
      (click)="onClick('as_info')"
    >
      <div class="menu-item-title">{{ asInfoOption().label }}</div>
      <div class="menu-item-icon">
        <i [class]="asInfoOption().icon" aria-hidden="true"></i>
      </div>
    </button>
  </li>
  <li
    class="menu-item cursor-pointer"
  >
    <button
      class="menu-item-button"
      type="button"
      [class.active]="childData().contentViewPropagation === 'as_content'"
      [disabled]="!((childData().permissions && (childData().permissions! | allowsGrantingContentView)) || childData().contentViewPropagation === 'as_content')"
      (click)="onClick('as_content')"
    >
      <div class="menu-item-title">{{ asContentOption().label }}</div>
      <div class="menu-item-icon">
        <i [class]="asContentOption().icon" aria-hidden="true"></i>
      </div>
    </button>
  </li>
</ul>
<div class="footer">
  <button
    class="primary size-s width-full alg-white-color light-border with-hover-eff"
    alg-button
    (click)="openAdvancedConfigurationDialogEvent.emit()"
    i18n
  >
    Advanced configuration
  </button>
</div>
